<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>tokatonton - 予定調整</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/event.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="index.html">tokatonton</a>
    <span class="site-subtitle">予定調整</span>
  </header>

  <main class="container">
    <div id="message"></div>
    <p id="loading" class="loading">読み込み中…</p>

    <div id="event-view" hidden>
      <section class="card">
        <h1 id="event-title"></h1>
        <p id="event-description" class="description"></p>
        <p id="event-deadline" class="deadline"></p>
        <div id="decided-banner" class="decided-banner" hidden></div>
      </section>

      <section id="admin-menu" class="card card-admin" hidden>
        <h2>幹事メニュー</h2>
        <p class="hint">この画面は幹事用 URL で開いています。幹事用 URL は他の人に教えないでください。</p>
        <div class="url-row">
          <input id="share-url" type="text" readonly aria-label="参加者に送る URL">
          <button id="copy-share" class="btn" type="button">参加者用 URL をコピー</button>
        </div>
        <div class="actions actions-left">
          <button id="decide-start" class="btn btn-primary" type="button">日程を確定する</button>
          <button id="decide-cancel" class="btn" type="button" hidden>確定を取り消す</button>
          <a id="edit-link" class="btn">イベントを編集</a>
          <button id="delete-event" class="btn btn-danger" type="button">イベントを削除</button>
        </div>
      </section>

      <section class="card">
        <div class="section-header">
          <h2>回答状況</h2>
          <button id="new-response" class="btn btn-primary" type="button">回答する</button>
        </div>

        <div id="participants" class="participants"></div>

        <div id="decide-bar" class="decide-bar" hidden>
          <p id="decide-text"></p>
          <div class="actions actions-left">
            <button id="decide-confirm" class="btn btn-primary" type="button" hidden>この日時で確定</button>
            <button id="decide-exit" class="btn" type="button">やめる</button>
          </div>
        </div>

        <div class="summary-layout">
          <div id="summary-grid"></div>
          <div id="slot-detail" class="slot-detail">
            <p class="hint">マスにカーソルを乗せる（スマホではタップする）と、その時間に参加できる人が表示されます。</p>
          </div>
        </div>

        <p class="hint legend">
          マスの数字は ○ の人数です。色が濃いほど参加できる人が多く、
          <span class="legend-best">太枠</span> は ○ が最も多い時間です。
        </p>
      </section>

      <section id="response-section" class="card" hidden>
        <h2 id="response-title">回答する</h2>
        <form id="response-form" novalidate>
          <div class="field">
            <label for="response-name">お名前 <span class="required">必須</span></label>
            <input id="response-name" type="text" maxlength="100" required>
          </div>

          <div class="field">
            <label>都合のよい時間</label>
            <div class="brush-bar">
              <span class="hint">塗る記号:</span>
              <div id="brushes" class="brushes" role="radiogroup" aria-label="塗る記号"></div>
              <button id="fill-rest" class="btn btn-small" type="button">未入力のマスを×にする</button>
              <button id="clear-answers" class="btn btn-small" type="button">すべて消す</button>
            </div>
            <p class="hint">記号を選んでマスをなぞると塗れます。同じ記号のマスからなぞると消えます。灰色のマスは候補外です。</p>
            <div id="answer-grid"></div>
          </div>

          <div class="field">
            <label for="response-comment">コメント</label>
            <textarea id="response-comment" rows="2" maxlength="1000"></textarea>
          </div>

          <div id="response-error" class="field-error" role="alert"></div>

          <div class="actions">
            <button id="delete-response" class="btn btn-danger" type="button" hidden>この回答を削除</button>
            <button id="cancel-response" class="btn btn-secondary" type="button">キャンセル</button>
            <button id="save-response" class="btn btn-primary" type="submit">回答を保存</button>
          </div>
        </form>
      </section>

      <section id="comment-section" class="card" hidden>
        <h2>コメント</h2>
        <ul id="comment-list" class="comment-list"></ul>
      </section>
    </div>
  </main>
</body>
</html>
